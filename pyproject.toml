[project]
name = "db-guardian"
version = "0.1.0"
description = "Scheduled MySQL backups with history, retention and signed downloads"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "apscheduler>=3.10,<4",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=43",
    "pydantic-settings>=2.7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db_guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--import-mode=importlib"
markers = ["integration: needs MySQL servers and the mysqldump client"]
